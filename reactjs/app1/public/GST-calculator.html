<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free GST Calculator UI</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts for a clean SaaS Look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }

        /* Card Styling */
        .calculator-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* Inputs Section */
        .form-label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .input-group-text {
            background-color: #ffffff;
            color: #6c757d;
            font-weight: 500;
        }
        
        .form-control:focus, .form-select:focus {
            box-shadow: none;
            border-color: #dee2e6;
        }
        
        .form-select {
            font-weight: 500;
            color: #495057;
        }

        /* Results Section Styling */
        .results-section {
            background-color: #f1f5f9;
        }

        .math-symbol {
            font-size: 1.25rem;
            font-weight: bold;
            color: #64748b;
            background-color: #e2e8f0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 15px auto;
        }

        .result-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0;
            line-height: 1.2;
        }

        /* Highlighted Total Box */
        .total-box {
            background: #ffffff;
            border: 2px solid #0d6efd;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.1);
        }
        
        .total-box .result-value {
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <!-- Header -->
    <div class="text-center mb-5 mt-4">
        <h1 class="fw-bold mb-3">Free GST Calculator</h1>
        <p class="text-muted fs-5">Calculate GST in minutes without any complex math.</p>
    </div>

    <!-- Main Calculator Component -->
    <div class="card calculator-card mx-auto bg-white" style="max-width: 950px;">
        <div class="row g-0">
            
            <!-- Left Side: Inputs -->
            <div class="col-md-7 p-4 p-lg-5">
                
                <!-- Amount Input -->
                <div class="mb-4 pb-2">
                    <label class="form-label">Amount</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text border-end-0 fs-5">₹</span>
                        <input type="text" class="form-control border-start-0 ps-0" value="10,000" readonly>
                    </div>
                </div>

                <!-- GST Percentage Dropdown -->
                <div class="mb-4 pb-2">
                    <label for="gstRateSelect" class="form-label">GST %</label>
                    <select class="form-select form-select-lg" id="gstRateSelect">
                        <option value="0">0%</option>
                        <option value="3">3%</option>
                        <option value="5">5%</option>
                        <option value="12">12%</option>
                        <option value="18" selected>18%</option>
                        <option value="28">28%</option>
                    </select>
                </div>

                <!-- Tax Exclusive/Inclusive Dropdown -->
                <div class="mb-2">
                    <label for="taxTypeSelect" class="form-label">Tax</label>
                    <select class="form-select form-select-lg" id="taxTypeSelect">
                        <option value="exclusive" selected>Exclusive</option>
                        <option value="inclusive">Inclusive</option>
                    </select>
                </div>

            </div>

            <!-- Right Side: Results Display -->
            <div class="col-md-5 p-4 p-lg-5 results-section d-flex flex-column justify-content-center text-center border-start">
                
                <!-- Actual Amount -->
                <div class="w-100">
                    <h2 class="result-value">10,000</h2>
                    <p class="result-title">Actual Amount</p>
                </div>

                <!-- Math Operator -->
                <div class="math-symbol">+</div>

                <!-- GST Amount -->
                <div class="w-100">
                    <h2 class="result-value">1,800</h2>
                    <p class="result-title">GST Amount</p>
                </div>

                <!-- Math Operator -->
                <div class="math-symbol">=</div>

                <!-- Total Amount -->
                <div class="w-100 total-box mt-2">
                    <h2 class="result-value">11,800</h2>
                    <p class="result-title text-primary mb-0">Total Amount</p>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle (Includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
