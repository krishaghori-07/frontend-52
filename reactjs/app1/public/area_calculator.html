<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area Calculator | The EasyLearn Academy</title>

  <!-- Bootstrap 5 CSS (CDN) — this is the only styling used, no custom CSS anywhere -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Top navbar (pure Bootstrap classes) -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">The EasyLearn Academy</span>
    </div>
  </nav>

  <div class="container py-5">

    <div class="text-center mb-5">
      <h1 class="display-6 fw-bold">Rectangle Area Calculator</h1>
      <p class="text-muted">Enter the length and width to see the formula used to work out the area.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6">

        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Rectangle</h5>
            <p class="card-subtitle text-muted mb-3">Area = Length &times; Width</p>
            <form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="rectLength" class="form-label">Length</label>
                  <input type="number" step="any" class="form-control" id="rectLength" placeholder="e.g. 10">
                </div>
                <div class="col-md-6">
                  <label for="rectWidth" class="form-label">Width</label>
                  <input type="number" step="any" class="form-control" id="rectWidth" placeholder="e.g. 5">
                </div>
              </div>
              <button type="submit" class="btn btn-primary mt-4">Calculate Area</button>
            </form>
          </div>
        </div>

        <!-- Note: this page is UI/markup only (Bootstrap 5 classes). No JavaScript
             has been written, so the "Calculate Area" button does not compute a
             result yet — that logic can be wired up separately if needed. -->

      </div>
    </div>
  </div>

  <footer class="text-center text-muted py-4">
    <small>The EasyLearn Academy &mdash; Bootstrap 5 UI Template</small>
  </footer>

</body>
</html>
