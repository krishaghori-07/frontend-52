<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
    }
    .card-header {
      background-color: #fff;
      border-bottom: 1px solid #f0f0f0;
      border-radius: 1rem 1rem 0 0 !important;
      padding: 1.5rem;
    }
    .card-header h4 {
      margin: 0;
      color: #212529;
      font-weight: 600;
    }
    .card-body {
      padding: 2rem;
    }
    .form-label {
      font-weight: 500;
      color: #495057;
    }
    .form-control {
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }
    .form-check-input:checked {
      background-color: #0d6efd;
      border-color: #0d6efd;
    }
    .btn-submit {
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-weight: 500;
    }
    .operation-group {
      background-color: #f8f9fa;
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .operation-group .form-check {
      padding-left: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .operation-group .form-check-input {
      margin-left: -1.25rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">

        <div class="card">
          <div class="card-header text-center">
            <h4>Simple Calculator</h4>
          </div>
          <div class="card-body">

            <form action="#" method="POST">

              <!-- First Number -->
              <div class="mb-4">
                <label for="num1" class="form-label">First Number</label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="num1" 
                  name="num1" 
                  placeholder="Enter first number" 
                  step="any"
                  required
                >
              </div>

              <!-- Second Number -->
              <div class="mb-4">
                <label for="num2" class="form-label">Second Number</label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="num2" 
                  name="num2" 
                  placeholder="Enter second number" 
                  step="any"
                  required
                >
              </div>

              <!-- Operation -->
              <div class="mb-4">
                <label class="form-label d-block">Operation</label>
                <div class="operation-group">
                  <div class="row">
                    <div class="col-6">
                      <div class="form-check">
                        <input 
                          class="form-check-input" 
                          type="radio" 
                          name="operation" 
                          id="addition" 
                          value="addition" 
                          required
                        >
                        <label class="form-check-label" for="addition">
                          Addition (+)
                        </label>
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="form-check">
                        <input 
                          class="form-check-input" 
                          type="radio" 
                          name="operation" 
                          id="subtraction" 
                          value="subtraction"
                        >
                        <label class="form-check-label" for="subtraction">
                          Subtraction (-)
                        </label>
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="form-check">
                        <input 
                          class="form-check-input" 
                          type="radio" 
                          name="operation" 
                          id="multiplication" 
                          value="multiplication"
                        >
                        <label class="form-check-label" for="multiplication">
                          Multiplication (×)
                        </label>
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="form-check">
                        <input 
                          class="form-check-input" 
                          type="radio" 
                          name="operation" 
                          id="division" 
                          value="division"
                        >
                        <label class="form-check-label" for="division">
                          Division (÷)
                        </label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-submit">
                  Calculate
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
