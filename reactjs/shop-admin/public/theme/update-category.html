<!doctype html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title></title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />


  <link rel="preload" href="./css/adminlte.css" as="style" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
    integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q=" crossorigin="anonymous" media="print"
    onload="this.media = 'all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    crossorigin="anonymous" />

  <link rel="stylesheet" href="css/adminlte.css" />
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
  <div class="app-wrapper">

    <nav class="app-header navbar navbar-expand bg-body">
      <div class="container-fluid">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle sidebar">
              <i class="bi bi-list"></i>
            </a>
          </li>

          <li>
            <h4>Admin panel for online shop</h4>
          </li>
        </ul>
      </div>
    </nav>

    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
      <div class="sidebar-brand"></div>

      <div class="sidebar-wrapper">
        <ul class="nav flex-column">
          <li class="nav-item border-bottom">
            <a href="#" class="nav-link fs-5">Sample link</a>
          </li>
        </ul>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-6">
              <h1 class="mb-0 fs-3">Category Management</h1>
            </div>
          </div>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">
          <div class="row">
            <div class="col-12">
              <div class="card">
                <div class="card-header text-bg-primary">
                  <h3 class="card-title fs-5">Edit category</h3>
                </div>

                <div class="card-body">
                  <div class="row">
                      <div class="col-2">
                        <h5 class="mb-1 mt-3 pb-2 border-bottom">Existing Image</h5> <br>
                        <img src="http://www.picsum.photos/300" class="img-fluid img-thumbnail shadow">
                      </div>
                      <div class="col-10">
                          <!-- form -->
                  <form>
                    <div class="card-body">
                      <div class="mb-3">
                        <label for="title" class="form-label">Edit category title</label>
                        <input type="email" class="form-control" id="title" required />

                      </div>

                      <div class="mb-3">
                        <label for="photo" class="form-label">Change Photo</label>
                        <input type="file" class="form-control" id="photo" required />

                      </div>
                      <h6 class="text-secondary small text-uppercase mb-2 mt-3">Is Live</h6>
                      <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="islive" id="yes" checked />
                        <label class="form-check-label" for="radio-1">Yes</label>
                      </div>
                      <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="islive" id="no" />
                        <label class="form-check-label" for="radio-2">No</label>
                      </div>
                    </div>
                      <div class="text-end">
                        <button type="submit" class="btn btn-primary">Save changes</button>
                        <button type="clear" class="btn btn-dark">Clear all</button>
                      </div>
                  </form>
                  <!-- form -->
                      </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>

  <script src="./js/adminlte.js"></script>
</body>

</html>
