<!doctype html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Change Password</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <link rel="preload" href="./css/adminlte.css" as="style" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
    integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q=" crossorigin="anonymous" media="print"
    onload="this.media = 'all'" />
  <link class="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    crossorigin="anonymous" />

  <link rel="stylesheet" href="css/adminlte.css" />
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
  <div class="app-wrapper">

    <!-- Header -->
    <nav class="app-header navbar navbar-expand bg-body">
      <div class="container-fluid">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle sidebar">
              <i class="bi bi-list"></i>
            </a>
          </li>

          <li>
            <h4>Admin panel for online shop</h4>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Sidebar -->
    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
      <div class="sidebar-brand"></div>

      <div class="sidebar-wrapper">
        <ul class="nav flex-column">
          <li class="nav-item border-bottom">
            <a href="dashboard.html" class="nav-link fs-5">Dashboard</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="category.html" class="nav-link fs-5">Categories</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="users.html" class="nav-link fs-5">Users</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="orders.html" class="nav-link fs-5">Orders</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="product.html" class="nav-link fs-5">Products</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="change-password.html" class="nav-link fs-5 active bg-primary text-white">Change Password</a>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row align-items-center">
            <div class="col-sm-6">
              <h1 class="mb-0 fs-3">Account Settings</h1>
            </div>
            <div class="col-sm-6">
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb float-sm-end mb-0">
                  <li class="breadcrumb-item"><a href="category.html">Home</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Change Password</li>
                </ol>
              </nav>
            </div>
          </div>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">
          <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
              <div class="card shadow">
                <div class="card-header text-bg-primary">
                  <h3 class="card-title fs-5 mb-0">Change Password</h3>
                </div>

                <div class="card-body">
                  <!-- Form -->
                  <form action="category.html" method="GET" onsubmit="return validatePassword(event);">
                    
                    <!-- Old Password -->
                    <div class="mb-3">
                      <label for="oldPassword" class="form-label fw-semibold">Old Password</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" class="form-control" id="oldPassword" placeholder="Enter old password" required />
                      </div>
                    </div>

                    <!-- New Password -->
                    <div class="mb-3">
                      <label for="newPassword" class="form-label fw-semibold">New Password</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required />
                      </div>
                    </div>

                    <!-- Confirm New Password -->
                    <div class="mb-4">
                      <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required />
                      </div>
                    </div>

                    <!-- Submit / cancel controls -->
                    <div class="text-end border-top pt-3">
                      <a href="category.html" class="btn btn-dark me-2">Cancel</a>
                      <button type="submit" class="btn btn-primary">Change Password</button>
                    </div>
                  </form>
                  <!-- Form -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="./js/adminlte.js"></script>

  <script>
    function validatePassword(event) {
      const oldPass = document.getElementById("oldPassword").value;
      const newPass = document.getElementById("newPassword").value;
      const confirmPass = document.getElementById("confirmPassword").value;

      if (newPass !== confirmPass) {
        alert("New password and confirm new password do not match!");
        event.preventDefault();
        return false;
      }

      if (oldPass === newPass) {
        alert("New password cannot be the same as old password!");
        event.preventDefault();
        return false;
      }

      alert("Password updated successfully!");
      return true;
    }
  </script>
</body>

</html>
