        <ul class="nav flex-column">

            <a href="dashboard.html" class="nav-link fs-5">Dashboard</a>

            <div class="col-sm-6">
              <h1 class="mb-0 fs-3">Category Management</h1>
            </div>
          </div>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">
          <div class="row">
            <div class="col-12">
              <div class="card">
                <div class="card-header text-bg-primary">
                  <div class="d-flex justify-content-between">

                    <h3 class="">Existing Categories</h3>
                    <div><a href="insert-category.html" class="btn btn-light">Add new cateogry</a></div>
                  </div>
                </div>

                <div class="card-body">
                  <!-- TABLE -->
                  <div class="table-responsive">
                    <table class="table align-middle mb-0">
                      <thead>
                        <tr>
                          <th>Title</th>
                          <th>Status</th>
                          <th>Photo</th>
                          <th class="text-end">Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td>
                            Mobiles
                           
                          </td>
                          <td>
                            <span class="badge text-bg-success"> Yes </span>
                          </td>
                          <td>
                            <img src="http://www.picsum.photos/100" class="img-fluid">
                          </td>
                          <td class="text-end">
                            <div class="btn-group btn-group-sm">
                              <button class="btn btn-outline-secondary" type="button" title="Delete">
                                <i class="bi bi-trash" aria-hidden="true"></i>
                              </button>
                              <button class="btn btn-outline-secondary" type="button" title="Edit">
                                <i class="bi bi-pencil" aria-hidden="true"></i>

                        </tr>
