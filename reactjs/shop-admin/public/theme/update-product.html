<!doctype html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Update Product</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <link rel="preload" href="./css/adminlte.css" as="style" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
    integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q=" crossorigin="anonymous" media="print"
    onload="this.media = 'all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    crossorigin="anonymous" />

  <link rel="stylesheet" href="css/adminlte.css" />
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
  <div class="app-wrapper">

    <!-- Header -->
    <nav class="app-header navbar navbar-expand bg-body">
      <div class="container-fluid">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle sidebar">
              <i class="bi bi-list"></i>
            </a>
          </li>

          <li>
            <h4>Admin panel for online shop</h4>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Sidebar -->
    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
      <div class="sidebar-brand"></div>

      <div class="sidebar-wrapper">
        <ul class="nav flex-column">
          <li class="nav-item border-bottom">
            <a href="dashboard.html" class="nav-link fs-5">Dashboard</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="category.html" class="nav-link fs-5">Categories</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="users.html" class="nav-link fs-5">Users</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="orders.html" class="nav-link fs-5">Orders</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="product.html" class="nav-link fs-5 active bg-primary text-white">Products</a>
          </li>
          <li class="nav-item border-bottom">
            <a href="change-password.html" class="nav-link fs-5">Change Password</a>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row align-items-center">
            <div class="col-sm-6">
              <h1 class="mb-0 fs-3">Product Management</h1>
            </div>
            <div class="col-sm-6">
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb float-sm-end mb-0">
                  <li class="breadcrumb-item"><a href="product.html">Products</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Update Product</li>
                </ol>
              </nav>
            </div>
          </div>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">
          <div class="row">
            <div class="col-12">
              <div class="card">
                <div class="card-header text-bg-primary">
                  <h3 class="card-title fs-5 mb-0">Edit Product</h3>
                </div>

                <div class="card-body">
                  <div class="row">
                    <!-- Left side: Existing Image (col-2) -->
                    <div class="col-2 text-center border-end">
                      <h5 class="mb-1 mt-3 pb-2 border-bottom">Existing Image</h5> <br>
                      <img src="http://www.picsum.photos/300" class="img-fluid img-thumbnail shadow mb-3" alt="Product Image">
                    </div>

                    <!-- Right side: Form (col-10) -->
                    <div class="col-10">
                      <!-- Form -->
                      <form action="product.html" method="GET" onsubmit="alert('Product updated successfully!');">
                        <div class="row g-3 mb-3">
                          <!-- Category select -->
                          <div class="col-md-6">
                            <label for="category" class="form-label fw-semibold">Category</label>
                            <select class="form-select" id="category" required>
                              <option value="" disabled>Select category...</option>
                              <option value="Electronics" selected>Electronics</option>
                              <option value="Apparel">Apparel</option>
                              <option value="Office Supplies">Office Supplies</option>
                              <option value="Home & Kitchen">Home & Kitchen</option>
                            </select>
                          </div>

                          <!-- Name -->
                          <div class="col-md-6">
                            <label for="name" class="form-label fw-semibold">Product Name</label>
                            <input type="text" class="form-control" id="name" value="Wireless Bluetooth Headphones" placeholder="e.g. Wireless Bluetooth Headphones" required />
                          </div>
                        </div>

                        <div class="row g-3 mb-3">
                          <!-- Price -->
                          <div class="col-md-4">
                            <label for="price" class="form-label fw-semibold">Price ($)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="price" value="99.00" placeholder="0.00" required />
                          </div>

                          <!-- Quantity -->
                          <div class="col-md-4">
                            <label for="quantity" class="form-label fw-semibold">Quantity</label>
                            <input type="number" min="0" class="form-control" id="quantity" value="45" placeholder="0" required />
                          </div>

                          <!-- Weight -->
                          <div class="col-md-4">
                            <label for="weight" class="form-label fw-semibold">Weight</label>
                            <input type="text" class="form-control" id="weight" value="0.25 kg" placeholder="e.g. 0.25 kg" />
                          </div>
                        </div>

                        <div class="row g-3 mb-3">
                          <!-- Size -->
                          <div class="col-md-4">
                            <label for="size" class="form-label fw-semibold">Size</label>
                            <input type="text" class="form-control" id="size" value="Medium" placeholder="e.g. Medium, 15-inch" />
                          </div>

                          <!-- Change Photo file upload -->
                          <div class="col-md-8">
                            <label for="photo" class="form-label fw-semibold">Change Photo</label>
                            <input type="file" class="form-control" id="photo" />
                            <span class="text-secondary small">Leave blank to keep existing photo.</span>
                          </div>
                        </div>

                        <div class="row g-3 mb-3">
                          <!-- Detail description -->
                          <div class="col-12">
                            <label for="detail" class="form-label fw-semibold">Product Detail / Description</label>
                            <textarea class="form-control" id="detail" rows="4" placeholder="Enter product description here..." required>High-quality wireless over-ear headphones with active noise cancellation and 40h battery life.</textarea>
                          </div>
                        </div>

                        <!-- Is Live radio group -->
                        <div class="mb-4">
                          <h6 class="text-secondary small text-uppercase fw-semibold mb-2">Is Live</h6>
                          <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="islive" id="yes" value="Yes" checked />
                            <label class="form-check-label" for="yes">Yes</label>
                          </div>
                          <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="islive" id="no" value="No" />
                            <label class="form-check-label" for="no">No</label>
                          </div>
                        </div>

                        <!-- Submit / cancel controls -->
                        <div class="text-end border-top pt-3">
                          <a href="product.html" class="btn btn-dark me-2">Cancel</a>
                          <button type="submit" class="btn btn-primary">Save changes</button>
                        </div>
                      </form>
                      <!-- Form -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="./js/adminlte.js"></script>
</body>

</html>
